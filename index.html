<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>
	  Portfolio
	</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0 auto;
      max-width: 900px;
      padding: 20px;
      line-height: 1.5;
    }
h1{
		font: 48pt/1.0em 'Dancing Script', cursive;
		text-align: center;
		text-shadow: 2px 3px 6px pink;
}
    .gallery {
      display: flex;
      flex-wrap: wrap; 
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      background-color: #f0d3df;
      padding: 20px;
      border-radius: 6px;
    }
 
    figure {
      margin: 0;
      width: 300px;
      text-align: center;
    }
 
    figure img {
      width: 300px;
      height: 200px;
      object-fit: cover;
      display: block;
      background-color: #ccc;
      transition: transform 0.3s ease;
    }
 
    figure img:hover {
      transform: scale(1.05);
    }
 
    figcaption {
      font-size: 0.9em;
      margin-top: 8px;
    }
  </style>
</head>
<body> 
  <h1>
<em>Portfolio</em></h1>
  <div class="gallery">
 
    <figure>
      <a href="img1.JPG">
        <img src="thumb1.PNG" alt="Liquid" width="300" height="200">
      </a>
      <figcaption><em> Liquid </em> 2024, Digital</figcaption>
    </figure>
 
    <figure>
      <a href="img2.JPG">
        <img src="thumb2.PNG" alt="Star" width="300" height="200">
      </a>
      <figcaption><em> Star </em> 2024, Digital.</figcaption>
    </figure>
 
    <figure>
      <a href="img3.JPG">
        <img src="thumb3.PNG" alt="Couch" width="300" height="200">
      </a>
      <figcaption><em>Couch</em> 2025, digital </figcaption>
    </figure>
 
</div> 
</body>
</html>
